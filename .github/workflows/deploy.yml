# 推送到 main 后自动部署：SSH 登录服务器执行 deploy/update.sh（git pull → 构建 → 重启）。
# 需要在 GitHub 仓库 Settings → Secrets and variables → Actions 中配置：
#   SERVER_HOST（服务器公网 IP）、SERVER_USER（如 root）、SERVER_SSH_KEY（部署用私钥）
# 未配置密钥时工作流会直接跳过。
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_SERVER: ${{ secrets.SERVER_HOST != '' && secrets.SERVER_SSH_KEY != '' }}
    steps:
      - name: Skip when secrets are missing
        if: env.HAS_SERVER != 'true'
        run: echo "未配置 SERVER_HOST / SERVER_SSH_KEY，跳过部署。"

      - name: Deploy over SSH
        if: env.HAS_SERVER == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 25m
          script: cd /var/www/pop && bash deploy/update.sh
